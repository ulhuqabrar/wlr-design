<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>White Label Resell — White-label SEO, content, web &amp; analytics for agencies</title>
<meta name="description" content="White Label Resell is the production bench behind agencies. SEO, content, web development, paid media and analytics delivered under your brand." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip}
html,body{background:#000;color:#FFF}
body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::-webkit-scrollbar{width:0}
::selection{background:#FFF;color:#000}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid #FFF;outline-offset:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
@keyframes mfwd{from{transform:translateX(0)}to{transform:translateX(-33.333%)}}
@keyframes mrev{from{transform:translateX(-33.333%)}to{transform:translateX(0)}}
@keyframes heroBarIn0{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes heroBarIn1{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes heroMaskReveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0% 0)}}
@keyframes heroMaskRevealLate{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0% 0)}}
@keyframes heroFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes heroLineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes heroBarShift{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="lib/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
/* ═══ HOOKS ═══ */
const useReducedMotion=()=>{const[r,setR]=useState(false);useEffect(()=>{const mq=window.matchMedia('(prefers-reduced-motion:reduce)');setR(mq.matches);const h=e=>setR(e.matches);mq.addEventListener('change',h);return()=>mq.removeEventListener('change',h)},[]);return r};

const useInView=(th=0.2)=>{const ref=useRef(null);const[seen,setSeen]=useState(false);useEffect(()=>{const el=ref.current;if(!el)return;const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){setSeen(true);io.disconnect()}},{threshold:th,rootMargin:'0px 0px -10% 0px'});io.observe(el);return()=>io.disconnect()},[th]);return[ref,seen]};

/* ═══ HELPERS ═══ */
const clamp01=v=>Math.max(0,Math.min(1,v));
const range=(p,start,end)=>clamp01((p-start)/(end-start));
const lerp=(a,b,t)=>a+(b-a)*t;
const viewportProgress=(rect,vh)=>{const trigger=vh*.85,end=vh*.15;return clamp01((trigger-rect.top)/(trigger-end))};
const stickyProgress=(rect,vh)=>{const sp=rect.height-vh;return sp>0?clamp01(-rect.top/sp):0};
const EASE='cubic-bezier(.16,1,.3,1)';

/* ═══ SHARED ═══ */
const TB=({size=16,color='currentColor',gap=2})=>(
  <span style={{display:'inline-flex',alignItems:'flex-end',gap,height:size}}>
    {[.66,1,.82].map((h,i)=><span key={i} style={{width:size*.22,height:`${h*100}%`,background:color}}/>)}
  </span>
);
const K=({children,s={}})=>(
  <div style={{fontFamily:'"Geist Mono",monospace',fontSize:11,letterSpacing:'.22em',textTransform:'uppercase',opacity:.5,marginBottom:16,...s}}>{children}</div>
);
/* ═══ HUD ═══ */
const NL=({label,href})=>{const[h,setH]=useState(false);return(
  <a href={href} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
    style={{color:'#FFF',position:'relative',paddingBottom:2}}>
    <span style={{position:'relative',zIndex:1}}>{label}</span>
    <span style={{position:'absolute',bottom:0,left:0,width:'100%',height:1,background:'#FFF',transformOrigin:'left',transform:h?'scaleX(1)':'scaleX(0)',transition:'transform .3s cubic-bezier(.2,.8,.2,1)'}}/>
  </a>
)};

const HUD=()=>{
  const red=useReducedMotion();
  return(
    <nav style={{position:'fixed',top:0,left:0,right:0,zIndex:100,mixBlendMode:'difference',pointerEvents:'none',padding:'20px 32px',display:'flex',justifyContent:'space-between',alignItems:'center',color:'#FFF',fontFamily:'"Geist Mono",monospace',fontSize:11,letterSpacing:'.22em',textTransform:'uppercase',transition:'opacity .4s ease,transform .4s cubic-bezier(.2,.8,.2,1)'}}>
      <a href="index.html" style={{pointerEvents:'auto',display:'inline-flex',alignItems:'center',gap:12,color:'#FFF'}}>
        <TB size={14} color="#FFF" gap={3}/>White Label Resell
      </a>
      <span style={{pointerEvents:'auto',display:'flex',gap:28}}>
        <NL label="Home" href="index.html"/>
        <NL label="Work" href="case-studies.html"/>
        <NL label="About" href="about.html"/>
        <NL label="Team" href="team.html"/>
        <NL label="Get a Quote" href="contact.html"/>
      </span>
    </nav>
  );
};
/* ═══ 01 HERO ═══ */
const Hero=()=>{
  const red=useReducedMotion();
  const sRef=useRef(null);
  const e=useRef({});
  const [phase,setPhase]=useState(red?4:0);
  const [hbar,setHbar]=useState(false);
  const [pct,setPct]=useState('000%');

  /* ── entrance choreography ───────────────────────── */
  useEffect(()=>{
    if(red){setPhase(4);return}
    const timers=[
      setTimeout(()=>setPhase(1),200),
      setTimeout(()=>setPhase(2),750),
      setTimeout(()=>setPhase(3),1350),
      setTimeout(()=>setPhase(4),2100),
      setTimeout(()=>setHbar(true),2400),
    ];
    return()=>timers.forEach(clearTimeout);
  },[red]);

  /* ── scroll-driven parallax + inversion ──────────── */
  useEffect(()=>{
    const sec=sRef.current;if(!sec)return;
    let r=0,tr=0;
    const u=()=>{
      r=0;
      const rc=sec.getBoundingClientRect(),vh=window.innerHeight;
      /* p = 0 when hero fully visible, 1 when fully scrolled out */
      const p=Math.max(0,Math.min(1,-rc.top/vh));
      const el=e.current;

      /* parallax — only after entrance settles */
      if(p>.01&&el.b0){
        el.b0.style.transform=`translateY(${p*-35}px)`;
        el.b1.style.transform=`translateY(${p*-70}px)`;
        el.b2.style.transform=`translateY(${p*-18}px)`;
      }
      if(p>.01&&el.hd) el.hd.style.transform=`translateY(${p*-28}px)`;
      if(p>.01&&el.pa){el.pa.style.transform=`translateY(${p*14}px)`;el.pa.style.opacity=Math.max(0,1-p*3)}
      if(p>.01&&el.mt) el.mt.style.transform=`translateY(${p*18}px)`;
      if(p>.01&&el.sc) el.sc.style.transform=`translateY(${p*22}px)`;

      /* inversion panel — bottom to top at 40-90% */
      if(el.inv){
        const ip=Math.max(0,Math.min(1,(p-.4)/.5));
        el.inv.style.clipPath=`inset(${(1-ip)*100}% 0 0 0)`;
        el.inv.style.opacity=ip;
      }

      /* percentage */
      setPct(String(Math.round(p*100)).padStart(3,'0')+'%');
    };
    const on=()=>{if(!r)r=requestAnimationFrame(u);clearTimeout(tr);tr=setTimeout(u,80)};
    u();window.addEventListener('scroll',on,{passive:true});window.addEventListener('resize',u);
    return()=>{window.removeEventListener('scroll',on);window.removeEventListener('resize',u);if(r)cancelAnimationFrame(r);clearTimeout(tr)};
  },[red]);

  /* ── bar hover microinteraction ──────────────────── */
  const barHover=(i)=>{
    if(red)return;
    const el=e.current;
    if(i===0&&el.b0)el.b0.style.height='72%';
    if(i===1&&el.b1)el.b1.style.height='92%';
    if(i===2&&el.b2)el.b2.style.height='80%';
  };
  const barLeave=()=>{
    if(red)return;
    const el=e.current;
    if(el.b0)el.b0.style.height='68%';
    if(el.b1)el.b1.style.height='88%';
    if(el.b2)el.b2.style.height='76%';
  };

  const ease='cubic-bezier(.16,1,.3,1)';
  const easeMed='cubic-bezier(.2,.8,.2,1)';

  return(
    <section ref={sRef} style={{height:'200vh',position:'relative',background:'#000',color:'#FFF'}}>
      <div style={{position:'sticky',top:0,height:'100vh',overflow:'hidden'}}>

      {/* ── STRUCTURAL RULE — flashes in at 0.0s ── */}
      <div style={{
        position:'absolute',top:0,left:'42vw',width:1,height:'100vh',
        background:'rgba(255,255,255,.08)',
        transformOrigin:'top',transform:red?'scaleY(1)':(phase>=1?'scaleY(1)':'scaleY(0)'),
        transition:red?'none':'transform .4s '+ease+' .05s',
      }}/>

      {/* ── THREEBAR HERO OBJECT ── */}
      <div style={{
        position:'absolute',top:0,left:0,bottom:0,width:'42vw',
        display:'flex',alignItems:'flex-end',
        gap:'clamp(16px,2.8vw,40px)',padding:'0 6vw 8vh',
        pointerEvents:'none',zIndex:1,
      }}>
        {/* BAR 01 — rises from below */}
        <div
          ref={n=>{if(n)e.current.b0=n}}
          onMouseEnter={()=>barHover(0)} onMouseLeave={barLeave}
          style={{
            pointerEvents:'auto',cursor:'default',
            width:'clamp(56px,7.5vw,120px)',
            height: red?'68%':(phase>=1?'68%':'0%'),
            background:'#FFF',
            transformOrigin:'bottom',
            transform: red?'none':(phase>=1?'translateY(0)':'translateY(100%)'),
            transition: red?'none':`transform .55s ${ease} .25s, height .5s ${easeMed}`,
            willChange:phase>=4?'transform':'auto',
          }}
        />
        {/* BAR 02 — snaps downward from above */}
        <div
          ref={n=>{if(n)e.current.b1=n}}
          onMouseEnter={()=>barHover(1)} onMouseLeave={barLeave}
          style={{
            pointerEvents:'auto',cursor:'default',
            width:'clamp(56px,7.5vw,120px)',
            height: red?'88%':(phase>=1?'88%':'0%'),
            background:'#FFF',
            transformOrigin:'top',
            transform: red?'none':(phase>=1?'translateY(0)':'translateY(-100%)'),
            transition: red?'none':`transform .58s ${ease} .30s, height .5s ${easeMed}`,
            willChange:phase>=4?'transform':'auto',
          }}
        />
        {/* BAR 03 — rises from below */}
        <div
          ref={n=>{if(n)e.current.b2=n}}
          onMouseEnter={()=>barHover(2)} onMouseLeave={barLeave}
          style={{
            pointerEvents:'auto',cursor:'default',
            width:'clamp(56px,7.5vw,120px)',
            height: red?'76%':(phase>=1?'76%':'0%'),
            background:'#FFF',
            transformOrigin:'bottom',
            transform: red?'none':(phase>=1?'translateY(0)':'translateY(100%)'),
            transition: red?'none':`transform .62s ${ease} .35s, height .5s ${easeMed}`,
            willChange:phase>=4?'transform':'auto',
          }}
        />
      </div>

      {/* ── TYPOGRAPHY RIGHT SIDE ── */}
      <div style={{
        position:'absolute',top:0,right:0,bottom:0,width:'56vw',
        display:'flex',flexDirection:'column',justifyContent:'center',
        padding:'0 6vw 0 4vw',zIndex:2,
      }}>

        {/* Metadata — quiet arrival at 1.3s */}
        <div ref={n=>{if(n)e.current.mt=n}} style={{
          willChange:'transform',marginBottom:'clamp(12px,1.5vw,24px)',
          opacity:red?1:(phase>=3?1:0),
          transform:red?'none':(phase>=3?'translateY(0)':'translateY(12px)'),
          transition:red?'none':'opacity .3s ease, transform .3s '+easeMed,
        }}>
          <K style={{opacity:.5}}>White-label production · est. 2018</K>
        </div>

        {/* YOUR CLIENTS SEE YOU. — clip-mask reveal at 0.45s */}
        <h1 style={{margin:0,lineHeight:'-.04em'}}>
          <span ref={n=>{if(n)e.current.hd=n}} style={{
            display:'block',fontFamily:'Geist',
            fontSize:'clamp(52px,7.5vw,128px)',fontWeight:500,
            letterSpacing:'-.045em',lineHeight:.96,
            willChange:'transform',
            clipPath: red?'inset(0 0 0% 0)':(phase>=2?'inset(0 0 0% 0)':'inset(0 0 100% 0)'),
            transition: red?'none':'clip-path .5s '+ease+' .45s',
          }}>
            Your clients see you.
          </span>

          {/* WE DO THE WORK. — bar-reveal at 0.85s */}
          <span ref={n=>{if(n)e.current.hd2=n}} style={{
            display:'block',fontFamily:'Geist',
            fontSize:'clamp(52px,7.5vw,128px)',fontWeight:300,fontStyle:'italic',
            letterSpacing:'-.045em',lineHeight:.96,
            clipPath: red?'inset(0 0 0% 0)':(phase>=3?'inset(0 0 0% 0)':'inset(0 0 100% 0)'),
            transition: red?'none':'clip-path .55s '+ease+' .85s',
          }}>
            We do the work.
          </span>
        </h1>

        {/* Paragraph — quiet at 1.3s */}
        <p ref={n=>{if(n)e.current.pa=n}} style={{
          margin:'clamp(18px,2.5vw,32px) 0 0',maxWidth:480,
          fontSize:'clamp(14px,1.15vw,17px)',lineHeight:1.65,
          opacity:red?(phase>=3?1:0):(phase>=3?1:0),
          transform:red?'none':(phase>=3?'translateY(0)':'translateY(12px)'),
          transition:red?'none':'opacity .35s ease, transform .35s '+easeMed,
        }}>
          SEO, content, web development, paid media and analytics — built and shipped
          under your agency's brand. You keep the client, the credit and the margin.
        </p>

        {/* CTAs — arrive at 1.65s — mix-blend-mode inverts with panel */}
        <div ref={n=>{if(n)e.current.ct=n}} style={{
          display:'flex',gap:12,flexWrap:'wrap',
          marginTop:'clamp(24px,3vw,44px)',
          opacity:red?(phase>=4?1:0):(phase>=4?1:0),
          transform:red?'none':(phase>=4?'translateY(0)':'translateY(14px)'),
          transition:red?'none':'opacity .35s ease, transform .35s '+easeMed,
          mixBlendMode:'difference',zIndex:4,position:'relative',
        }}>
          <a href="contact.html" style={{
            display:'inline-flex',alignItems:'center',gap:12,
            padding:'16px 24px',background:'#FFF',color:'#000',
            fontFamily:'"Geist Mono",monospace',fontSize:11,
            letterSpacing:'.22em',textTransform:'uppercase',fontWeight:600,
            textDecoration:'none',
          }}>
            <TB size={11} color="#000"/>Get a quote
          </a>
          <a href="case-studies.html" style={{
            display:'inline-flex',alignItems:'center',
            padding:'16px 24px',border:'1px solid rgba(255,255,255,.4)',
            fontFamily:'"Geist Mono",monospace',fontSize:11,
            letterSpacing:'.22em',textTransform:'uppercase',
            textDecoration:'none',
          }}>
            See the work →
          </a>
        </div>
      </div>

      {/* ── SCROLL CUE — bottom left ── */}
      <div ref={n=>{if(n)e.current.sc=n}} style={{
        position:'absolute',bottom:'clamp(28px,4vh,48px)',left:32,
        display:'flex',alignItems:'center',gap:14,zIndex:6,pointerEvents:'none',
        opacity:red?1:0,mixBlendMode:'difference',
      }}>
        <span style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:'.22em',textTransform:'uppercase',opacity:.4}}>
          /01 · scroll
        </span>
        <div style={{width:32,height:1,background:'rgba(255,255,255,.2)',position:'relative',overflow:'hidden'}}>
          <div style={{
            position:'absolute',top:0,left:0,height:'100%',width:'100%',background:'#FFF',
            transformOrigin:'left',transform:red?'scaleX(1)':(hbar?'scaleX(1)':'scaleX(0)'),
            transition:red?'none':'transform 1.2s cubic-bezier(.2,.8,.2,1)',
          }}/>
        </div>
      </div>

      {/* ── PERCENTAGE — bottom right ── */}
      <div style={{
        position:'absolute',bottom:'clamp(28px,4vh,48px)',right:32,
        fontFamily:'"Geist Mono",monospace',fontSize:10,
        letterSpacing:'.22em',textTransform:'uppercase',opacity:.3,
        zIndex:6,pointerEvents:'none',mixBlendMode:'difference',
      }}>
        {pct}
      </div>

      {/* ── SECTION INDEX — top right ── */}
      <div style={{
        position:'absolute',top:'clamp(80px,10vh,120px)',right:32,
        fontFamily:'"Geist Mono",monospace',fontSize:10,
        letterSpacing:'.22em',textTransform:'uppercase',opacity:.2,
        zIndex:6,pointerEvents:'none',mixBlendMode:'difference',
      }}>
        01 / HOME
      </div>

      {/* ── INVERSION PANEL — bottom-to-top wipe ── */}
      <div ref={n=>{if(n)e.current.inv=n}} style={{
        position:'absolute',inset:0,background:'#FFF',color:'#000',zIndex:3,
        clipPath:'inset(100% 0 0 0)',opacity:0,pointerEvents:'none',
      }}>
        <div style={{position:'absolute',top:0,left:0,bottom:0,width:'42vw',display:'flex',alignItems:'flex-end',gap:'clamp(16px,2.8vw,40px)',padding:'0 6vw 8vh',pointerEvents:'none'}}>
          {[.68,.88,.76].map((h,i)=>(
            <div key={i} style={{width:'clamp(56px,7.5vw,120px)',height:`${h*100}%`,background:'#000'}}/>
          ))}
        </div>
        <div style={{position:'absolute',top:0,right:0,bottom:0,width:'56vw',display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 6vw 0 4vw'}}>
          <K style={{opacity:.5,color:'#000'}}>White-label production · est. 2018</K>
          <h1 style={{margin:0,fontFamily:'Geist',fontSize:'clamp(52px,7.5vw,128px)',fontWeight:500,letterSpacing:'-.045em',lineHeight:.96,color:'#000'}}>
            Your clients see you.<br/>
            <i style={{fontWeight:300}}>We do the work.</i>
          </h1>
          <p style={{margin:'clamp(18px,2.5vw,32px) 0 0',maxWidth:480,fontSize:'clamp(14px,1.15vw,17px)',lineHeight:1.65,opacity:.7,color:'#000'}}>
            SEO, content, web development, paid media and analytics — built and shipped
            under your agency's brand. You keep the client, the credit and the margin.
          </p>
        </div>
      </div>

      </div>{/* close sticky */}
    </section>
  );
};
/* ═══ 02 SELL / DELIVER ═══ */
const SellDeliver=()=>{
  const red=useReducedMotion();
  const sec=useRef(null);
  const e=useRef({});
  useEffect(()=>{
    const s=sec.current;if(!s)return;
    let r=0,tr=0,lastFlip=null;
    const u=()=>{
      r=0;
      const rc=s.getBoundingClientRect(),vh=window.innerHeight,sp=rc.height-vh;
      if(sp<=0)return;
      const p=Math.max(0,Math.min(1,-rc.top/sp));
      if(red)return;
      const{b0,b1,b2,hd,pc,fr}=e.current;
      // Three bars wipe — opposing directions
      if(b0){const w=Math.max(0,Math.min(1,(p-.08)/.35));b0.style.transform=`scaleX(${w})`}
      if(b1){const w=Math.max(0,Math.min(1,(p-.14)/.35));b1.style.transform=`scaleX(${w})`}
      if(b2){const w=Math.max(0,Math.min(1,(p-.20)/.35));b2.style.transform=`scaleX(${w})`}
      // Progress counter
      if(pc)pc.textContent=String(Math.round(p*100)).padStart(3,'0')+'%';
      // Flip at 50%
      const flip=p>.5;
      if(flip!==lastFlip){
        lastFlip=flip;
        if(hd){
          hd.style.transition='none';
          hd.style.opacity='0';
          hd.style.transform=flip?'translateY(30px)':'translateY(-30px)';
          requestAnimationFrame(()=>{requestAnimationFrame(()=>{
            hd.textContent=flip?'We deliver.':'You sell.';
            hd.style.transition='opacity .4s ease,transform .4s cubic-bezier(.2,.8,.2,1)';
            hd.style.opacity='1';
            hd.style.transform='translateY(0)';
          })}
        );
        }
      }
      // Frame markers opacity
      if(fr)fr.style.opacity=p>.05?1:0;
    };
    const on=()=>{if(!r)r=requestAnimationFrame(u);clearTimeout(tr);tr=setTimeout(u,80)};
    u();window.addEventListener('scroll',on,{passive:true});window.addEventListener('resize',u);
    return()=>{window.removeEventListener('scroll',on);window.removeEventListener('resize',u);if(r)cancelAnimationFrame(r);clearTimeout(tr)};
  },[red]);

  return(
    <section ref={sec} style={{height:'280vh',position:'relative',borderTop:'1px solid #FFF'}}>
      <div style={{position:'sticky',top:0,height:'100vh',overflow:'hidden',background:'#000',color:'#FFF'}}>
        {/* Wipe bars */}
        <div style={{position:'absolute',inset:0,pointerEvents:'none'}}>
          {/* Bar 01 — left to right */}
          <div ref={n=>{if(n)e.current.b0=n}} style={{
            position:'absolute',left:0,right:0,top:'18%',height:'12%',
            background:'#FFF',transformOrigin:'left center',transform:'scaleX(0)',
            willChange:'transform',mixBlendMode:'difference',
          }}/>
          {/* Bar 02 — right to left */}
          <div ref={n=>{if(n)e.current.b1=n}} style={{
            position:'absolute',left:0,right:0,top:'41%',height:'12%',
            background:'#FFF',transformOrigin:'right center',transform:'scaleX(0)',
            willChange:'transform',mixBlendMode:'difference',
          }}/>
          {/* Bar 03 — left to right */}
          <div ref={n=>{if(n)e.current.b2=n}} style={{
            position:'absolute',left:0,right:0,top:'64%',height:'12%',
            background:'#FFF',transformOrigin:'left center',transform:'scaleX(0)',
            willChange:'transform',mixBlendMode:'difference',
          }}/>
        </div>

        {/* Top label + progress */}
        <div ref={n=>{if(n)e.current.fr=n}} style={{
          position:'absolute',top:90,left:32,right:32,display:'flex',justifyContent:'space-between',
          fontFamily:'"Geist Mono",monospace',fontSize:11,letterSpacing:'.22em',
          textTransform:'uppercase',opacity:0,mixBlendMode:'difference',color:'#FFF',
        }}>
          <span>The partnership, in two words</span>
          <span ref={n=>{if(n)e.current.pc=n}}>000%</span>
        </div>

        {/* Center heading — mix-blend inverts where bars cross */}
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none',mixBlendMode:'difference'}}>
          <h2 ref={n=>{if(n)e.current.hd=n}} style={{
            margin:0,textAlign:'center',fontFamily:'Geist',
            fontSize:'clamp(64px,14vw,200px)',fontWeight:500,letterSpacing:'-.045em',lineHeight:1.08,
          }}>You sell.</h2>
        </div>

        {/* Bottom copy */}
        <p style={{

      if(e.b0){

      if(e.b1){

      if(e.b2){

      /* headline — lift 0-40%, fade out 35-45% */
      if(e.cap){

      if(e.zero){

        e.zero.style.opacity=Math.min(fi,fo);

        e.hRule.style.transform=`scaleX(${sc})`;

      /* center bar inversion 45-55% */
      if(e.cbar){

        if(p>.50&&!inv)setInv(true);

      /* bar color swap after inversion */
      const bc=inv?'#000':'#FFF';

      }

        <div style={{position:'absolute',right:'8vw',top:'10vh',bottom:'10vh',width:'clamp(180px,22vw,320px)',display:'flex',gap:'clamp(10px,1.6vw,22px)',alignItems:'flex-end',pointerEvents:'none',zIndex:3}}>

  const el=useRef({});
  const vel=useRef(0);
  const lastY=useRef(0);
  const items=['SEO','Content','Web development','Paid search','Paid social','Email','Analytics','Hosting','Reporting'];
  const list=[...items,...items,...items];
  useEffect(()=>{
    const s=sec.current;if(!s)return;
    let r=0;
    const u=()=>{
      r=0;
      const y=window.scrollY;
      const d=Math.abs(y-lastY.current);
      vel.current=Math.min(d*.15,3);
      lastY.current=y;
      // Apply velocity to marquee speed via animation-duration override
      if(!red&&seen){
        [0,1,2,3].forEach(row=>{
          const el2=el.current[`r${row}`];

    };
    const on=()=>{if(!r)r=requestAnimationFrame(u)};
    window.addEventListener('scroll',on,{passive:true});
    return()=>{window.removeEventListener('scroll',on);if(r)cancelAnimationFrame(r)};
  },[seen,red]);

  return(
    <section ref={ref} style={{background:'#000',color:'#FFF',borderTop:'1px solid #FFF',display:'flex',flexDirection:'column',justifyContent:'center',position:'relative',padding:'90px 0 70px',overflow:'hidden'}}>
      <div style={{position:'absolute',top:40,left:32,right:32,display:'flex',justifyContent:'space-between',mixBlendMode:'difference',color:'#FFF',fontFamily:'"Geist Mono",monospace',fontSize:11,letterSpacing:'.22em',textTransform:'uppercase',opacity:.5}}>
        <span>The bench, always on</span><span>20 specialists · 4 time zones</span>
      </div>
      {[0,1,2,3].map(row=>{
        const inv=row%2===1;
        return(
          <div key={row} ref={n=>{if(n)el.current[`r${row}`]=n}} style={{

/* ═══ 10 CLOSING SEQUENCE ═══ */
const Close=()=>{
  const red=useReducedMotion();
  const sec=useRef(null);
  const el=useRef({});
  const stageRef=useRef(0);
  const steps=[
    ['SELL','You win the client'],
    ['SCOPE','We write the SOW'],
    ['SHIP','Our bench produces'],
    ['SCALE','You keep the margin'],
  ];

  useEffect(()=>{
    if(!red)return;
    const e=el.current;
    /* show final state for reduced motion */
    [e.w0,e.w1,e.w2,e.w3].forEach(w=>{if(w){w.style.opacity='0';w.style.pointerEvents='none'}});
    if(e.w3){e.w3.style.opacity='1';e.w3.style.transform='none';e.w3.style.pointerEvents='auto'}
    if(e.align){e.align.style.opacity='1';e.align.style.transform='none'}
    if(e.indicator)e.indicator.textContent='04 / 04';
    if(e.progLine)e.progLine.style.transform='scaleX(1)';
  },[red]);

  useEffect(()=>{
    const s=sec.current;if(!s)return;
    let r=0,tr=0;
    const u=()=>{
      r=0;
      const rc=s.getBoundingClientRect(),vh=window.innerHeight,sp=rc.height-vh;
      if(sp<=0)return;
      const p=Math.max(0,Math.min(1,-rc.top/sp));
      if(red)return;
      const e=el.current;

      /* transition functions for each word */
      const t0=()=>{
        /* SELL: hold 0-18%, exit left 18-27% */
        const hold=p<.18?1:Math.max(0,1-(p-.18)/.09);
        const slide=p<.18?0:Math.min(1,(p-.18)/.09);
        return{op:hold,tx:-slide*110,ty:0,sc:1};
      };
      const t1=()=>{
        /* SCOPE: enter right 22-27%, hold 27-43%, exit up 43-52% */
        const enter=p<.22?0:p<.27?Math.min(1,(p-.22)/.05):1;
        const exit=p<.43?0:p<.52?Math.min(1,(p-.43)/.09):1;
        return{op:enter*(1-exit),tx:(1-enter)*110,ty:-exit*100,sc:1};
      };
      const t2=()=>{
        /* SHIP: enter below 47-52%, hold 52-68%, exit scale 68-78% */
        const enter=p<.47?0:p<.52?Math.min(1,(p-.47)/.05):1;
        const exit=p<.68?0:p<.78?Math.min(1,(p-.68)/.1):1;
        return{op:enter*(1-exit),tx:0,ty:(1-enter)*100,sc:1-exit*.2};
      };
      const t3=()=>{
        /* SCALE: enter scale 72-78%, hold 78-88%, exit 88-92% */
        const enter=p<.72?0:p<.78?Math.min(1,(p-.72)/.06):1;
        const exit=p<.88?0:Math.min(1,(p-.88)/.04);
        return{op:enter*(1-exit),tx:0,ty:0,sc:.75+enter*.25};
      };

      const fns=[t0,t1,t2,t3];
      const words=[e.w0,e.w1,e.w2,e.w3];
      const results=fns.map(fn=>fn());

      words.forEach((w,i)=>{
        if(!w)return;
        const r=results[i];
        w.style.opacity=r.op;
        w.style.transform=`translate(${r.tx}%,${r.ty}px) scale(${r.sc})`;
        w.style.pointerEvents=r.op>.5?'auto':'none';
      });

      /* determine display stage for indicator */
      let ds=0;
      if(p<.22)ds=0;
      else if(p<.47)ds=1;
      else if(p<.72)ds=2;
      else if(p<.88)ds=3;
      else ds=3;

      if(e.indicator)e.indicator.textContent=`0${ds+1} / 04`;

      /* progress line */
      if(e.progLine){
        e.progLine.style.transform=`scaleX(${Math.min(1,p/.88)})`;
      }

      /* final process rail */
      if(e.align){
        const ap=Math.max(0,Math.min(1,(p-.88)/.06));
        e.align.style.opacity=ap;
        e.align.style.transform=`translateY(${(1-ap)*20}px)`;
      }
    };
    const on=()=>{if(!r)r=requestAnimationFrame(u);clearTimeout(tr);tr=setTimeout(u,80)};
    u();window.addEventListener('scroll',on,{passive:true});window.addEventListener('resize',u);
    return()=>{window.removeEventListener('scroll',on);window.removeEventListener('resize',u);if(r)cancelAnimationFrame(r);clearTimeout(tr)};
  },[red]);

  return(
    <section ref={sec} style={{height:'200vh',position:'relative',borderTop:'1px solid #FFF'}}>
      <div style={{position:'sticky',top:0,height:'100vh',background:'#000',color:'#FFF',overflow:'hidden'}}>

        {/* Top label */}
        <div style={{position:'absolute',top:32,left:32,right:32,display:'flex',justifyContent:'space-between',alignItems:'flex-start',zIndex:2}}>
          <div style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:'.22em',textTransform:'uppercase',opacity:.5}}>Working with us</div>
          <div style={{textAlign:'right'}}>
            <div ref={n=>{if(n)el.current.indicator=n}} style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:'.22em',textTransform:'uppercase',opacity:.5}}>01 / 04</div>
            <div style={{width:60,height:1,background:'rgba(255,255,255,.15)',marginTop:8,marginLeft:'auto'}}>
              <div ref={n=>{if(n)el.current.progLine=n}} style={{height:'100%',background:'#FFF',transformOrigin:'left',transform:'scaleX(0)'}}/>
            </div>
          </div>
        </div>

        {/* Giant word display */}
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
          {steps.map(([w,sub],i)=>(
            <div key={w} ref={n=>{if(n)el.current['w'+i]=n}} style={{
              position:'absolute',textAlign:'center',
              willChange:'transform,opacity',
              opacity:0,pointerEvents:'none',
            }}>
              <div style={{
                fontFamily:'Geist',fontSize:'clamp(90px,17vw,250px)',
                fontWeight:500,letterSpacing:'-.05em',lineHeight:.92,
              }}>{w}</div>
              <div style={{
                fontFamily:'"Geist Mono",monospace',fontSize:'clamp(10px,1vw,13px)',
                letterSpacing:'.18em',textTransform:'uppercase',opacity:.4,
                marginTop:'clamp(8px,1vw,16px)',
              }}>0{i+1} / {sub}</div>
            </div>
          ))}
        </div>

        {/* Final process rail */}
        <div ref={n=>{if(n)el.current.align=n}} style={{
          position:'absolute',bottom:'clamp(40px,6vh,80px)',left:32,right:32,
          opacity:0,display:'flex',justifyContent:'space-between',zIndex:2,
        }}>
          {steps.map(([w,sub],i)=>(
            <div key={w} style={{flex:1,textAlign:'center',position:'relative'}}>
              {i>0&&<div style={{position:'absolute',left:0,top:'50%',width:'100%',height:1,background:'rgba(255,255,255,.2)',transform:'translateY(-50%)'}}/>}
              <div style={{position:'relative',background:'#000',padding:'0 12px'}}>
                <div style={{fontFamily:'"Geist Mono",monospace',fontSize:9,letterSpacing:'.18em',textTransform:'uppercase',opacity:.4,marginBottom:6}}>0{i+1}</div>
                <div style={{fontFamily:'Geist',fontSize:'clamp(20px,3vw,36px)',fontWeight:500,letterSpacing:'-.04em'}}>{w}</div>
                <div style={{fontFamily:'"Geist Mono",monospace',fontSize:'clamp(8px,.8vw,10px)',letterSpacing:'.15em',textTransform:'uppercase',opacity:.4,marginTop:6}}>{sub}</div>
              </div>
            </div>
          ))}
        </div>

      </div>
    </section>
  );
};
