const {useState,useEffect,useRef}=React;

/* ═══ HELPERS ═══ */
const clamp01=v=>Math.max(0,Math.min(1,v));
const range=(p,start,end)=>clamp01((p-start)/(end-start));
const lerp=(a,b,t)=>a+(b-a)*t;
const stickyProgress=(rect,vh)=>{const sp=rect.height-vh;return sp>0?clamp01(-rect.top/sp):0};
const viewportProgress=(rect,vh)=>{const trigger=vh*.85,end=vh*.15;return clamp01((trigger-rect.top)/(trigger-end))};
const EASE='cubic-bezier(.16,1,.3,1)';

const useReducedMotion=()=>{
  const[r,setR]=useState(()=>window.matchMedia('(prefers-reduced-motion:reduce)').matches);
  useEffect(()=>{const mq=window.matchMedia('(prefers-reduced-motion:reduce)');setR(mq.matches);const h=e=>setR(e.matches);mq.addEventListener('change',h);return()=>mq.removeEventListener('change',h)},[]);
  return r;
};

/* ═══ SCROLL PERCENTAGE ═══ */
const ScrollPct=()=>{
  const ref=useRef(null);
  useEffect(()=>{
    let r=0,tr=0;
    const u=()=>{r=0;const h=document.documentElement.scrollHeight-window.innerHeight;const p=h>0?clamp01(window.scrollY/h):0;if(ref.current)ref.current.textContent=String(Math.round(p*100)).padStart(2,'0')+'%'};
    const on=()=>{if(!r)r=requestAnimationFrame(u);clearTimeout(tr);tr=setTimeout(u,80)};
    window.addEventListener('scroll',on,{passive:true});
    return()=>{window.removeEventListener('scroll',on);if(r)cancelAnimationFrame(r);clearTimeout(tr)};
  },[]);
  return <div ref={ref} style={{position:'fixed',bottom:28,right:32,zIndex:100,mixBlendMode:'difference',fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:'.22em',textTransform:'uppercase',opacity:.3,pointerEvents:'none',color:'#FFF'}}>00%</div>;
};

/* ═══ NUMBER COUNTER ═══ */
const useCountUp=(target,duration=2000,active=false)=>{
  const[val,setVal]=useState(0);
  useEffect(()=>{
    if(!active)return;
    let raf;
    const start=performance.now();
    const animate=(now)=>{
      const elapsed=now-start;
      const progress=Math.min(elapsed/duration,1);
      const eased=1-Math.pow(1-progress,3);
      setVal(Math.round(target*eased));
      if(progress<1)raf=requestAnimationFrame(animate);
    };
    raf=requestAnimationFrame(animate);
    return()=>cancelAnimationFrame(raf);
  },[active,target,duration]);
  return val;
};
